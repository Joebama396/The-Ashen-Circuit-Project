name: Publish Linux release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml
      - RELEASE_NOTES_v1.3.md
      - START_HERE.txt
      - build.sh

permissions:
  contents: write

concurrency:
  group: publish-v1.3
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: v1.3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v

      - name: Download AppImage packaging tool
        run: |
          curl --fail --location --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage build.sh

      - name: Build release files
        run: ./build.sh

      - name: Smoke-test packaged game
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: sh dist/Play-The-Ashen-Circuit.sh --smoke-test

      - name: Validate archives and checksums
        run: |
          unzip -tq dist/The_Ashen_Circuit-1.3-Ubuntu.zip
          tar -tzf dist/The_Ashen_Circuit-1.3-Linux-Portable.tar.gz >/dev/null
          (cd dist && sha256sum --check SHA256SUMS-1.3.txt)

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/The_Ashen_Circuit-1.3-x86_64.AppImage
            dist/The_Ashen_Circuit-1.3-Ubuntu.zip
            dist/The_Ashen_Circuit-1.3-Linux-Portable.tar.gz
            dist/SHA256SUMS-1.3.txt
            dist/START_HERE.txt
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "The Ashen Circuit v1.3" \
              --notes-file RELEASE_NOTES_v1.3.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "The Ashen Circuit v1.3" \
              --notes-file RELEASE_NOTES_v1.3.md
          fi
