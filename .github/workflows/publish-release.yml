name: Publish Linux release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml
      - RELEASE_NOTES_v1.9.md
      - START_HERE.txt
      - build.sh
      - ashen-circuit.spec
      - game.py
      - seamless.py
      - defeat_screen.py
      - battle_animations.py
      - assets/audio/game_over.mp3
      - assets/characters/battle/**
      - tests/**

permissions:
  contents: write

concurrency:
  group: publish-v1.9
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: v1.9
      RELEASE_VERSION: 1.9
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v

      - name: Download AppImage packaging tool
        run: |
          curl --fail --location --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output runtime-static-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x appimagetool-x86_64.AppImage build.sh

      - name: Build release files
        env:
          ASHEN_VERSION: ${{ env.RELEASE_VERSION }}
        run: ./build.sh

      - name: Smoke-test packaged game
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: sh dist/Play-The-Ashen-Circuit.sh --smoke-test

      - name: Validate archives and checksums
        run: |
          unzip -tq dist/The_Ashen_Circuit-${RELEASE_VERSION}-Ubuntu.zip
          tar -tzf dist/The_Ashen_Circuit-${RELEASE_VERSION}-Linux-Portable.tar.gz >/dev/null
          (cd dist && sha256sum --check SHA256SUMS-${RELEASE_VERSION}.txt)
          file dist/The_Ashen_Circuit-${RELEASE_VERSION}-x86_64.AppImage | grep -q 'static-pie linked'

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: The_Ashen_Circuit-${{ env.RELEASE_VERSION }}-x86_64.AppImage
          path: dist/The_Ashen_Circuit-${{ env.RELEASE_VERSION }}-x86_64.AppImage
          compression-level: 0

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/The_Ashen_Circuit-${RELEASE_VERSION}-x86_64.AppImage
            dist/The_Ashen_Circuit-${RELEASE_VERSION}-Ubuntu.zip
            dist/The_Ashen_Circuit-${RELEASE_VERSION}-Linux-Portable.tar.gz
            dist/SHA256SUMS-${RELEASE_VERSION}.txt
            dist/START_HERE.txt
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "The Ashen Circuit v1.9" \
              --notes-file RELEASE_NOTES_v1.9.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "The Ashen Circuit v1.9" \
              --notes-file RELEASE_NOTES_v1.9.md
          fi
